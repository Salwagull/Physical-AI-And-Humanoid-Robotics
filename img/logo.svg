<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Robot Head -->
  <ellipse cx="50" cy="35" rx="25" ry="28" fill="none" stroke="url(#logoGradient)" stroke-width="3" filter="url(#logoGlow)"/>

  <!-- Eyes -->
  <circle cx="40" cy="30" r="6" fill="#06b6d4"/>
  <circle cx="60" cy="30" r="6" fill="#06b6d4"/>
  <circle cx="40" cy="30" r="3" fill="#ffffff"/>
  <circle cx="60" cy="30" r="3" fill="#ffffff"/>

  <!-- Antenna -->
  <line x1="50" y1="7" x2="50" y2="0" stroke="url(#logoGradient)" stroke-width="2"/>
  <circle cx="50" cy="0" r="4" fill="#a855f7"/>

  <!-- Body -->
  <path d="M30 63 L70 63 L75 80 L65 90 L35 90 L25 80 Z" fill="none" stroke="url(#logoGradient)" stroke-width="3" filter="url(#logoGlow)"/>

  <!-- Core -->
  <circle cx="50" cy="75" r="8" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="50" cy="75" r="4" fill="#06b6d4" opacity="0.7"/>

  <!-- Arms (simplified) -->
  <line x1="30" y1="68" x2="18" y2="68" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="68" x2="82" y2="68" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round"/>
</svg>
